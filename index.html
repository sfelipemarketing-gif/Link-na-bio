<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#010103">
  <meta name="description" content="Entre no universo de SFelipe. Acesse minhas músicas e fale comigo pelo WhatsApp.">
  <title>SFelipe · Meus links</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div id="ripples" aria-hidden="true"></div>
  <a class="skip" href="#links">Ir para os links</a>
  <main class="page">
    <div class="toolbar">
      <span class="eyebrow"><span class="status-dot" aria-hidden="true"></span> ENTRE NO MEU UNIVERSO</span>
      <div class="tools">
        <button class="icon-button" id="music" aria-label="Ativar música" title="Ativar música" hidden></button>
        <button class="icon-button" id="effects" aria-label="Pausar animações" title="Pausar animações"></button>
        <button class="icon-button" id="share" aria-label="Compartilhar esta página" title="Compartilhar"></button>
      </div>
    </div>
    <header class="profile">
      <div class="avatar-wrap"><div id="avatar" class="avatar" aria-hidden="true"></div><span class="sparkle" aria-hidden="true">✧</span></div>
      <p id="handle" class="handle"></p>
      <h1 id="name">SFelipe</h1>
      <p id="description" class="description"></p>
    </header>
    <div class="section-label"><span>ESCOLHA SUA PRÓXIMA CONEXÃO</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18h12V6"/></svg></div>
    <nav id="links" class="links" aria-label="Meus links"></nav>
    <p id="demo" class="demo" hidden>Prévia do modelo · os destinos ainda não foram configurados.</p>
    <footer><span class="footer-mark" aria-hidden="true">✧</span><span>Toque a tela. Explore o meu universo.</span></footer>
    <noscript><p>Ative o JavaScript para ver os links desta página.</p></noscript>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
