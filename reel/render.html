<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// RUNWAY AI — reel em motion design puro (sem imagens), 1080x1920 @30fps.
// window.draw(t) desenha o quadro no tempo t (segundos).
const W=1080,H=1920;
const C={ink:'#0B0D12',graphite:'#111318',blue:'#3999FF',deep:'#1E6FE6',gray:'#858B96',light:'#EAF3FF',white:'#FFFFFF'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VO=0.5;let WD=[];
window.ready=(async()=>{
  try{WD=await (await fetch('words.json')).json();}catch(e){}
  for(const f of ['900 100px Inter','800 100px Inter','700 40px Inter','600 40px Inter','500 40px Inter','500 30px "JetBrains Mono"'])await document.fonts.load(f);
  buildGrain();buildParticles();return true;
})();

// ---------- utilitários ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eo=k=>1-Math.pow(1-k,3);
const eoX=k=>k>=1?1:1-Math.pow(2,-10*k);
const eiX=k=>k<=0?0:Math.pow(2,10*k-10);
const back=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const win=(t,a,b,fi=.3,fo=.3)=>Math.min(P(t,a,a+fi),1-P(t,b-fo,b));
const wt=i=>WD[i]?WD[i].s+VO:0;
function font(w,s,f){ctx.font=`${w} ${s}px ${f==='mono'?'"JetBrains Mono"':'Inter'}`;}
function txt(s,x,y,{w=800,size=60,color=C.ink,align='center',alpha=1,f,ls=0}={}){
  ctx.save();ctx.globalAlpha*=alpha;font(w,size,f);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function card(x,y,w,h,{r=28,alpha=1,border='rgba(57,153,255,.25)',fill='rgba(255,255,255,.92)',shadow=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.shadowColor=`rgba(30,111,230,${.16*shadow})`;ctx.shadowBlur=60;ctx.shadowOffsetY=24;
  rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=border;ctx.lineWidth=2;ctx.stroke();ctx.restore();}
function line(x1,y1,x2,y2,{color=C.blue,w=3,alpha=1,dash=null,cap='round'}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap=cap;
  if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function dot(x,y,r,color=C.blue,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,7);ctx.fill();ctx.restore();}
function ring(x,y,r,{color=C.blue,w=3,alpha=1,a0=0,a1=Math.PI*2}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,r,a0,a1);ctx.stroke();ctx.restore();}
function chip(s,x,y,{alpha=1,size=26,dark=false,align='center'}={}){
  ctx.save();ctx.globalAlpha*=alpha;font(700,size);ctx.letterSpacing='3px';const tw=ctx.measureText(s).width+48;
  const x0=align==='center'?x-tw/2:align==='left'?x:x-tw;rr(x0,y-size*.95,tw,size*1.9,size*.95);
  ctx.fillStyle=dark?C.ink:'rgba(255,255,255,.95)';ctx.fill();ctx.strokeStyle=dark?C.ink:C.blue;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=dark?C.white:C.deep;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x0+tw/2+1.5,y+1);ctx.restore();return tw;}
function conn(x1,y1,x2,y2,k,o={}){if(k<=0)return;line(x1,y1,lerp(x1,x2,k),lerp(y1,y2,k),o);dot(lerp(x1,x2,k),lerp(y1,y2,k),6,o.color||C.blue,o.alpha??1);}
function arrowRow(a,b,y,size,alpha=1){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;font(800,size);ctx.letterSpacing='4px';const wa=ctx.measureText(a).width,wb=ctx.measureText(b).width;
  const gap=size*1.7,x=W/2-(wa+wb+gap)/2;txt(a,x,y,{size,w:800,ls:4,align:'left'});txt('→',x+wa+gap/2,y-2,{size,w:700,color:C.blue});
  txt(b,x+wa+gap,y,{size,w:800,ls:4,align:'left',color:C.deep});ctx.restore();}

// ---------- fundo branco com tonalização azul ----------
function background(t){
  ctx.fillStyle=C.white;ctx.fillRect(0,0,W,H);
  const blobs=[[.15+.08*Math.sin(t*.21),.18+.05*Math.cos(t*.17),900,.20],[.9+.06*Math.cos(t*.19),.55+.08*Math.sin(t*.13),1000,.16],[.3+.1*Math.sin(t*.11+2),.95,900,.14]];
  for(const [x,y,r,a] of blobs){const g=ctx.createRadialGradient(x*W,y*H,0,x*W,y*H,r);g.addColorStop(0,`rgba(57,153,255,${a})`);g.addColorStop(1,'rgba(57,153,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  ctx.save();ctx.fillStyle='rgba(30,111,230,.10)';const off=(t*10)%48;
  for(let y=-48;y<H+48;y+=48)for(let x=24;x<W;x+=48){ctx.fillRect(x,y+off,2.2,2.2);}ctx.restore();
}
let GR=[];function buildGrain(){for(let k=0;k<6;k++){const g=document.createElement('canvas');g.width=540;g.height=960;const gc=g.getContext('2d');
  const d=gc.createImageData(540,960);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*200;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}gc.putImageData(d,0,0);GR.push(g);}}
function grain(t,a=.035){const g=GR[Math.floor(t*30)%GR.length];if(!g)return;ctx.save();ctx.globalAlpha=a;ctx.globalCompositeOperation='soft-light';ctx.drawImage(g,0,0,W,H);ctx.restore();}

// ---------- texto cinético sincronizado com a narração ----------
// beat: {a,b: índices de palavras; y: centro do bloco; size; emph:[índices]; out: tempo de saída; minT}
function kinetic(t,bt){
  const out=bt.out;const first=bt.minT?Math.min(bt.minT,wt(bt.a)):wt(bt.a);if(t<first-.2||t>out+.3)return;
  const size=bt.size||74,maxW=bt.maxW||940;const items=[];
  for(let i=bt.a;i<=bt.b;i++){const em=(bt.emph||[]).includes(i);const s=em?size*1.12:size;font(em?900:800,s);ctx.letterSpacing='-1px';
    items.push({i,s,em,w:ctx.measureText(WD[i].t).width,sp:size*.26});}
  const lines=[];let cur=[],cw=0;for(const it of items){const add=(cur.length?it.sp:0)+it.w;if(cw+add>maxW&&cur.length){lines.push({items:cur,w:cw});cur=[];cw=0;}cw+=(cur.length?it.sp:0)+it.w;cur.push(it);}lines.push({items:cur,w:cw});
  const lh=size*1.16;const total=lines.length*lh;let y=bt.y-total/2+lh/2;
  const ex=eiX(P(t,out,out+.3));let k=0;
  for(const ln of lines){let x=W/2-ln.w/2;
    for(const it of ln.items){
      const st=Math.max(wt(it.i)-.08,(bt.minT||0)+k*.06);k++;
      const p=eoX(P(t,st,st+.38));if(p>0){
        ctx.save();ctx.globalAlpha=p*(1-ex);
        const dy=(1-p)*46-ex*40;const blur=(1-p)*10+ex*8;if(blur>.3)ctx.filter=`blur(${blur.toFixed(1)}px)`;
        ctx.translate(x+it.w/2,y+dy);const sc=lerp(1.18,1,p);ctx.scale(sc,sc);
        font(it.em?900:800,it.s);ctx.letterSpacing='-1px';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=it.em?C.blue:C.ink;ctx.fillText(WD[it.i].t,0,0);
        if(it.em){const u=eo(P(t,st+.15,st+.5));ctx.filter='none';ctx.fillStyle=C.blue;ctx.globalAlpha=p*(1-ex)*.25;ctx.fillRect(-it.w/2,it.s*.42,it.w*u,it.s*.14);}
        ctx.restore();}
      x+=it.w+it.sp;}
    y+=lh;}
}

// ---------- ícones vetoriais ----------
function cameraIcon(x,y,s,{alpha=1,k=1,color=C.ink}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.rect(-260,-200,520*k,400);ctx.clip();
  ctx.strokeStyle=color;ctx.lineWidth=10;ctx.lineJoin='round';
  rr(-180,-110,360,230,34);ctx.stroke();rr(-80,-150,120,40,12);ctx.stroke();
  ctx.beginPath();ctx.arc(0,5,70,0,7);ctx.stroke();ctx.beginPath();ctx.arc(0,5,36,0,7);ctx.strokeStyle=C.blue;ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(130,-70,10,0,7);ctx.fill();ctx.restore();}
function dropShape(x,y,r,color=C.blue,alpha=1){if(r<=0)return;ctx.save();ctx.globalAlpha*=alpha;const g=ctx.createLinearGradient(x-r,y-r*2,x+r,y+r);g.addColorStop(0,'#8FC6FF');g.addColorStop(1,C.deep);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y-r*1.9);ctx.bezierCurveTo(x+r*.5,y-r*1.1,x+r,y-r*.4,x+r,y+r*.2);ctx.arc(x,y+r*.2,r,0,Math.PI);ctx.bezierCurveTo(x-r,y-r*.4,x-r*.5,y-r*1.1,x,y-r*1.9);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(x-r*.35,y-r*.1,r*.15,r*.32,-.3,0,7);ctx.fill();ctx.restore();}
function imageIcon(x,y,w,h,{alpha=1,m=0,t=0,stroke=C.ink}={}){
  ctx.save();ctx.globalAlpha*=alpha;rr(x-w/2,y-h/2,w,h,24);ctx.fillStyle='rgba(234,243,255,.95)';ctx.fill();ctx.save();rr(x-w/2,y-h/2,w,h,24);ctx.clip();
  const sunY=y-h*.18-m*h*.1*Math.sin(t*1.2)-m*16;dot(x+w*.2,sunY,w*.08,C.blue);
  const px=m*Math.sin(t*1.1)*w*.05;
  ctx.fillStyle='rgba(30,111,230,.35)';ctx.beginPath();ctx.moveTo(x-w/2-40+px*.5,y+h/2);ctx.lineTo(x-w*.15+px*.5,y-h*.05);ctx.lineTo(x+w*.25+px*.5,y+h/2);ctx.fill();
  ctx.fillStyle=C.deep;ctx.beginPath();ctx.moveTo(x-w*.2+px,y+h/2);ctx.lineTo(x+w*.15+px,y+h*.05);ctx.lineTo(x+w/2+60+px,y+h/2);ctx.fill();
  ctx.restore();rr(x-w/2,y-h/2,w,h,24);ctx.strokeStyle=stroke;ctx.lineWidth=6;ctx.stroke();ctx.restore();}
function playFrame(x,y,w,h,{alpha=1,on=0,t=0}={}){ctx.save();ctx.globalAlpha*=alpha;rr(x-w/2,y-h/2,w,h,22);
  const g=ctx.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);g.addColorStop(0,`rgba(57,153,255,${.12+.6*on})`);g.addColorStop(1,`rgba(30,111,230,${.08+.75*on})`);ctx.fillStyle=g;ctx.fill();
  ctx.save();rr(x-w/2,y-h/2,w,h,22);ctx.clip();for(let i=0;i<5;i++){const sx=x-w/2+((t*160+i*w/4)%(w+200))-100;ctx.fillStyle=`rgba(255,255,255,${.18*on})`;ctx.fillRect(sx,y-h/2,40,h);}ctx.restore();
  rr(x-w/2,y-h/2,w,h,22);ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.stroke();
  for(let i=0;i<8;i++){ctx.fillStyle=on>.5?'rgba(255,255,255,.6)':'rgba(11,13,18,.15)';rr(x-w/2+20+i*(w-40)/8,y-h/2+10,(w-40)/8-14,12,4);ctx.fill();rr(x-w/2+20+i*(w-40)/8,y+h/2-22,(w-40)/8-14,12,4);ctx.fill();}
  ctx.fillStyle=on>.5?C.white:C.ink;ctx.beginPath();const s=h*.16;ctx.moveTo(x-s*.7,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x-s*.7,y+s);ctx.closePath();ctx.fill();
  if(on>0){rr(x-w/2+30,y+h/2-48,(w-60),6,3);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();rr(x-w/2+30,y+h/2-48,(w-60)*((t*.35)%1),6,3);ctx.fillStyle=C.white;ctx.fill();}
  ctx.restore();}
function aiCore(x,y,r,{alpha=1,spin=1,t=0,glow=0}={}){ctx.save();ctx.globalAlpha*=alpha;
  const g=ctx.createRadialGradient(x,y,0,x,y,r*1.8);g.addColorStop(0,`rgba(57,153,255,${.25+.35*glow})`);g.addColorStop(1,'rgba(57,153,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r*2,y-r*2,r*4,r*4);
  for(let i=0;i<3;i++){const rad=r*(.55+i*.25);const a=t*spin*(i%2?-1:1)*(1+i*.4);ring(x,y,rad,{w:i===1?5:3,color:i===1?C.blue:C.ink,alpha:.85,a0:a,a1:a+Math.PI*(1.1+i*.2)});}
  for(let i=0;i<6;i++){const a=t*spin*.6+i*Math.PI/3;dot(x+Math.cos(a)*r*1.05,y+Math.sin(a)*r*1.05,6,C.deep);}
  dot(x,y,r*.22,C.blue);txt('IA',x,y+2,{size:r*.24,w:900,color:C.white});ctx.restore();}
function textCard(x,y,w,h,{alpha=1,fill=1,label='TEXTO'}={}){card(x-w/2,y-h/2,w,h,{alpha,r:24});ctx.save();ctx.globalAlpha*=alpha;
  txt(label,x-w/2+28,y-h/2+34,{size:20,w:700,color:C.blue,align:'left',ls:4});
  [.9,.75,.55].forEach((l,i)=>{rr(x-w/2+28,y-h/2+66+i*30,(w-56)*l,12,6);ctx.fillStyle='rgba(11,13,18,.08)';ctx.fill();
    const f=cl(fill*3-i);if(f>0){rr(x-w/2+28,y-h/2+66+i*30,(w-56)*l*f,12,6);ctx.fillStyle=C.ink;ctx.fill();}});ctx.restore();}
function carIcon(cx,cy,s,rot,{alpha=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;const pr=(X,Y,Z)=>{const xr=X*Math.cos(rot)-Z*Math.sin(rot),zr=X*Math.sin(rot)+Z*Math.cos(rot);return [cx+xr*s,cy+(zr*.3-Y)*s];};
  const box=(w,d,h0,h1,col,lw)=>{const p=[];for(const sx of[-1,1])for(const sz of[-1,1])for(const yy of[h0,h1])p.push(pr(sx*w,yy,sz*d));
    const e=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';e.forEach(([i,j])=>{ctx.beginPath();ctx.moveTo(...p[i]);ctx.lineTo(...p[j]);ctx.stroke();});};
  box(1.7,.8,.2,.8,C.ink,4);box(1.0,.72,.8,1.35,C.blue,3.5);
  for(const sx of[-1.1,1.1])for(const sz of[-.82,.82]){const [x,y]=pr(sx,.2,sz);ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(x,y,.22*s,0,7);ctx.fill();}
  ctx.restore();}

// ---------- partículas (câmera -> rede neural) ----------
let PT=[];function buildParticles(){let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let i=0;i<64;i++){const per=i/64;let x,y;if(per<.25){x=-180+per/.25*360;y=-110;}else if(per<.5){x=180;y=-110+(per-.25)/.25*230;}else if(per<.75){x=180-(per-.5)/.25*360;y=120;}else{x=-180;y=120-(per-.75)/.25*230;}
    const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*330;PT.push({x0:x,y0:y,x1:Math.cos(a)*r,y1:Math.sin(a)*r*.9,ph:rnd()*6});}}

// ======================= CENAS =======================
const BEATS=[
 {a:0,b:8,y:380,emph:[5,8],out:3.45,minT:1.4,size:78},
 {a:9,b:15,y:1420,emph:[9,15],out:5.85,size:81},
 {a:16,b:22,y:900,emph:[22],out:7.9,size:96},
 {a:23,b:33,y:360,emph:[29,30],out:12.75,size:74},
 {a:34,b:46,y:360,emph:[35,46],out:17.45,size:74},
 {a:47,b:55,y:340,emph:[51,54],out:21.15,size:78},
 {a:56,b:59,y:340,emph:[59],out:23.45,size:83},
 {a:60,b:67,y:340,emph:[67],out:25.65,size:83},
 {a:68,b:72,y:360,emph:[72],out:27.55,size:83},
 {a:73,b:82,y:360,emph:[79,82],out:31.0,size:78},
 {a:83,b:88,y:900,emph:[87],out:33.2,size:100,maxW:820},
 {a:89,b:96,y:350,emph:[],out:36.25,size:74},
 {a:97,b:110,y:330,emph:[100,103,107],out:40.95,size:67},
 {a:111,b:123,y:340,emph:[116,118],out:45.25,size:72},
 {a:124,b:130,y:300,emph:[127,130],out:48.05,size:72},
 {a:131,b:137,y:300,emph:[132,137],out:51.25,size:72},
 {a:138,b:144,y:420,emph:[143,144],out:53.75,size:83},
];

// S01 GANCHO 0–6
function s01(t){
  if(t<1.5){const k=eoX(P(t,.12,.5));const fly=eiX(P(t,1.1,1.45));const sc=lerp(.6,1,k)*(1+fly*6);const a=P(t,.12,.16)*(1-P(t,1.3,1.45));
    ctx.save();ctx.globalAlpha=a;if(fly>0||k<1)ctx.filter=`blur(${(fly*14+(1-k)*8).toFixed(1)}px)`;ctx.translate(W/2,900);ctx.scale(sc,sc);
    txt('SEM',0,-110,{size:190,w:900,ls:-4});txt('CÂMERA?',0,90,{size:190,w:900,ls:-6,color:C.blue});ctx.restore();}
  const draw=eio(P(t,1.45,2.3));const diss=eio(P(t,3.95,4.7));
  if(t>1.45&&diss<1)cameraIcon(W/2,920,1.15,{k:draw,alpha:1-diss});
  // risco em "sem"
  const st=eo(P(t,3.62,3.95));if(st>0&&diss<1)line(W/2-260,1130,lerp(W/2-260,W/2+260,st),lerp(1130,700,st),{w:12,color:C.blue,alpha:1-diss});
  // partículas formam a rede neural (IA)
  if(diss>0){const net=eo(P(t,4.7,5.3));const fade=1-P(t,5.75,6.0);
    const pts=PT.map(p=>[W/2+lerp(p.x0*1.15,p.x1,diss)+Math.sin(t*1.5+p.ph)*6*diss,920+lerp(p.y0*1.15,p.y1,diss)+Math.cos(t*1.3+p.ph)*6*diss]);
    ctx.save();ctx.strokeStyle=C.blue;ctx.lineWidth=1.5;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d<130){ctx.globalAlpha=net*.5*fade*(1-d/130);ctx.beginPath();ctx.moveTo(...pts[i]);ctx.lineTo(...pts[j]);ctx.stroke();}}
    ctx.restore();pts.forEach((p,i)=>dot(p[0],p[1],i%7?5:8,i%7?C.ink:C.blue,fade));
    if(net>0){const pr=(t*1.2)%1;ring(W/2,920,60+pr*300,{alpha:(1-pr)*.4*fade,w:2});}}
  kinetic(t,BEATS[0]);kinetic(t,BEATS[1]);
}

// S02 O QUE É O RUNWAY 6–17.6
function s02(t){
  kinetic(t,BEATS[2]);
  // linha-guia sob "Runway" (o logotipo oficial pode ser inserido em assets/logo.png)
  if(t<8.1){const u=eo(P(t,7.4,7.8))*(1-P(t,7.8,8.1));line(W/2-200,1010,W/2-200+400*u,1010,{w:6,alpha:u});}
  kinetic(t,BEATS[3]);kinetic(t,BEATS[4]);
  if(t<8.5)return;
  const a1=back(cl(P(t,8.5,9.1))),a2=back(cl(P(t,9.2,9.8))),a3=back(cl(P(t,9.9,10.5)));
  const out=1-P(t,17.3,17.6);
  ctx.save();ctx.globalAlpha=out;
  const y1=760,y2=1090,y3=1420;
  ctx.save();ctx.translate(W/2,y1);ctx.scale(a1,a1);textCard(0,0,620,170,{fill:eo(P(t,13.2,14.0)),label:'01 · TEXTO'});ctx.restore();
  conn(W/2,y1+85,W/2,y2-120,eo(P(t,9.0,9.4)),{w:3,alpha:.6});
  for(let i=0;i<4;i++){const f=P(t,14.6+i*.12,15.2+i*.12);if(f>0&&f<1)dot(W/2,lerp(y1+85,y2-120,f),7,C.blue);}
  ctx.save();ctx.translate(W/2,y2);ctx.scale(a2,a2);aiCore(0,0,105,{t,spin:1+3*P(t,14.9,15.4)*(1-P(t,16.6,17)),glow:P(t,14.9,15.6)});ctx.restore();
